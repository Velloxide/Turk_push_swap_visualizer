<script>
var lang='en',S=[],cur=0,tm=null,rk={},N=0,vals=[],bars={},insp=null,ARR=[],hov=null,csub=0,labKey='',lastRow='',tbKey='',lastCur=-1,curT=null;
try{lang=localStorage.getItem('tk_l')||((navigator.language||'').slice(0,2)=='ar'?'ar':'en');var t0=localStorage.getItem('tk_t');if(t0)document.documentElement.setAttribute('data-theme',t0)}catch(e){}

function $(i){return document.getElementById(i)}

document.querySelectorAll('[data-e]').forEach(function(x){x.textContent=lang=='ar'?x.getAttribute('data-a'):x.getAttribute('data-e')});
$('lang').textContent=lang=='ar'?'English':'العربية'}
function sc(i,l){return i<=l-i?i:-(l-i)}

var a=arr.slice(),b=[],R=[],ph=0,tb=null,hb=null,hw=null;

function d(n,t,m,f){
if(n=='pb')b.unshift(a.shift());else if(n=='pa')a.unshift(b.shift());
else if(n=='ra')a.push(a.shift());else if(n=='rb')b.push(b.shift());

sn(n,t,m,f)}

function tA(x){var g=a.filter(function(v){return v>x});return g.length?Math.min.apply(null,g):Math.min.apply(null,a)}
sn('',L('Initial state','الحالة الأولية'),L('All numbers are in A and B is empty. Goal: A sorted ascending (smallest on top) and B empty. Phase 1 moves numbers to B so that B stays in descending order; phase 2 brings them back to A in their place.','كل الأرقام في A وB فارغ. الهدف: A مرتب تصاعديا (الأصغر في القمة) وB فارغ. المرحلة 1 تنقل الأرقام إلى B بحيث يبقى B مرتبا تنازليا، والمرحلة 2 تعيدها إلى A في مواضعها.'),'main()');

var k=0;

$('tbh').textContent=T.free?L('Hover a row to preview it on the stacks. Click to pin it and see how its cost is computed.','مرّر على صف لمعاينته على المكدسين. اضغط لتثبيته ورؤية كيف حُسبت تكلفته.'):L('This step is about the chosen number, so the table is locked.','هذه الخطوة خاصة بالرقم المختار، لذلك الجدول مقفل.');

var cs=$('lg').children;for(var j=0;j<cs.length;j++){var ix=+cs[j].getAttribute('data-i');cs[j].className='chip'+(ix==cur?' on':ix<cur?' dn':'')}
var pb=$('phs').children;for(var p=0;p<pb.length;p++)pb[p].className=(p==s.ph?'on':'')}
function stop(){if(tm){clearInterval(tm);tm=null}$('pl').textContent='▶'}
function go(i){insp=null;hov=null;cur=Math.max(0,Math.min(S.length-1,i));show()}
function parse(){return $('inp').value.split(/[\s,;]+/).filter(Boolean).map(Number)}
function chips(){$('nums').innerHTML=parse().map(function(v){return '<span>'+(isNaN(v)?'?':v)+'</span>'}).join('')}
function start(keep){stop();var e=$('er');e.textContent='';var arr=parse();
if(arr.length<5||arr.length>14||arr.some(function(x){return !Number.isInteger(x)||Math.abs(x)>9999})){e.textContent=L('Enter 5 to 14 whole numbers separated by spaces','أدخل من 5 إلى 14 رقما صحيحا مفصولة بمسافات');return}
if(new Set(arr).size!=arr.length){e.textContent=L('Numbers must not repeat','الأرقام يجب ألا تتكرر');return}
ARR=arr;tbKey='';labKey='';lastRow='';lastCur=-1;hov=null;vals=arr.slice();N=arr.length;var so=arr.slice().sort(function(x,y){return x-y});rk={};so.forEach(function(v,i){rk[v]=i});
S=build(arr,$('mg').checked);
$('s2').textContent=nops(S);$('s3').textContent=nops(build(arr,false));$('s4').textContent=nops(build(arr,true));
$('sc').max=S.length-1;

var pc='';PH().forEach(function(n,i){pc+='<button data-p="'+i+'">'+n+'</button>'});$('phs').innerHTML=pc;
if(!keep||!bars[arr[0]]||Object.keys(bars).length!=N)mkStage();
cur=keep?Math.min(keep,S.length-1):0;insp=null;show()}
function perm(n,f){var p=[];for(var i=1;i<=n;i++)p.push(i);if(f=='r')for(var j=p.length-1;j>0;j--){var k=Math.floor(Math.random()*(j+1)),t=p[j];p[j]=p[k];p[k]=t}if(f=='v')p.reverse();$('inp').value=p.join(' ');chips();start()}
$('go').onclick=function(){start()};$('mg').onchange=function(){start()};$('tbc').onchange=show;

$('n').oninput=function(){$('nv').textContent=this.value};
$('rnd').onclick=function(){perm(+$('n').value,'r')};$('srt').onclick=function(){perm(+$('n').value,'s')};$('rev').onclick=function(){perm(+$('n').value,'v')};
$('f').onclick=function(){stop();go(0)};$('l').onclick=function(){stop();go(S.length-1)};
$('pv').onclick=function(){stop();go(cur-1)};$('nx').onclick=function(){stop();go(cur+1)};

$('tb').onmouseover=function(e){var tr=e.target.closest('tr[data-v]');if(tr&&curT&&curT.free){var v=+tr.getAttribute('data-v');if(hov!=v){hov=v;show()}}};
$('tb').onmouseleave=function(){if(hov!=null){hov=null;show()}};

$('dots').onclick=function(e){var q=e.target.getAttribute('data-q');if(q!==null){csub=+q;labKey='';show()}};

tm=setInterval(function(){if(cur<S.length-1)go(cur+1);else stop()},delay())};
$('sp').oninput=function(){if(tm){stop();$('pl').click()}};
$('cp').onclick=function(){var t=S.filter(function(s){return s.o}).map(function(s){return s.o}).join('\n'),b=$('cp'),o=b.textContent;
function ok(){b.textContent=L('Copied','تم النسخ');setTimeout(function(){b.textContent=o},1200)}
function fb(){var x=document.createElement('textarea');x.value=t;x.style.cssText='position:fixed;opacity:0';document.body.appendChild(x);x.select();try{document.execCommand('copy');ok()}catch(e){}x.remove()}
try{navigator.clipboard.writeText(t).then(ok,fb)}catch(e){fb()}};
$('lang').onclick=function(){lang=lang=='ar'?'en':'ar';try{localStorage.setItem('tk_l',lang)}catch(e){}ui();var c=cur;start(c)};
$('th').onclick=function(){var r=document.documentElement,dk=r.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');var nt=dk=='dark'?'light':'dark';r.setAttribute('data-theme',nt);try{localStorage.setItem('tk_t',nt)}catch(e){}};
document.onkeydown=function(e){if(e.target.tagName=='INPUT'||e.ctrlKey||e.metaKey||e.altKey)return;if(e.key=='ArrowRight'){e.preventDefault();stop();go(cur+1)}else if(e.key=='ArrowLeft'){e.preventDefault();stop();go(cur-1)}};
ui();chips();start();
